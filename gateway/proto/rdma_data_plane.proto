syntax = "proto3";

package us3_turbo_access.gateway;

option cc_generic_services = true;

// UCX RMA WRITE 上传协议时序：
//   1) (control plane) OpenSession → session_id
//   2) PrepareTransfer(session_id, transfer_bytes)
//      → gateway: 分配+注册 gw_buf，ucp_rkey_pack；返回 ucx_port/gw_raddr/gw_packed_rkey
//   3) client: ucp_ep_create(ucx_port) + ucp_ep_rkey_unpack(gw_packed_rkey)
//      + ucp_put_nbx(gw_raddr, data) + ucp_ep_flush_nbx
//   4) CommitObject → gateway: 等 write_done → CRC → WriteRange → etag
//   5) client 收到 CommitObject 成功后: ep_close

message RdmaDiscoverRequest {
  string session_id     = 1;
  uint64 transfer_bytes = 4;  // WRITE: 本次传输字节数（用于 gateway 分配 gw_buf）
  reserved 2, 3;              // 2=client_raddr(RMA READ, removed), 3=client_packed_rkey(removed)
}

message RdmaDiscoverResponse {
  string host          = 1;
  uint32 port          = 2;
  uint64 max_msg_bytes = 4;
  uint32 ucx_port      = 5;   // UCX listener port（client ucp_ep_create 目标）
  uint64 gw_raddr      = 6;   // gateway buffer 虚地址（client ucp_put_nbx 目标）
  bytes  gw_packed_rkey = 7;  // gateway ucp_rkey_pack 结果（client ucp_ep_rkey_unpack 输入）
  reserved 3, 8;              // 3=device_gid(old), 8=ucx_tag(removed)
}

message RdmaBindRequest {
  string session_id = 1;
  uint64 conn_token = 2;
}

message RdmaBindResponse {
  uint64 raddr = 1;
  uint32 rkey = 2;
}

// 单对象 RDMA WRITE 完成后调用，触发 gateway 把 buffer 落到 backend 对象。
message RdmaCommitRequest {
  string session_id = 1;
  uint64 bytes_transferred = 2;
  string client_checksum = 3;
}

message RdmaCommitResponse {
  string etag = 1;
  string version = 2;
}

// Multipart 单 part 完成。
message RdmaCommitPartRequest {
  string session_id = 1;
  string upload_id = 2;
  uint32 part_number = 3;
  uint64 bytes_transferred = 4;
  string client_checksum = 5;
}

message RdmaCommitPartResponse {
  string part_etag = 1;
}

// 客户端在 PUT 流程的任意失败点（Bind / PostWrite / 等完成）调用，让 gateway
// 立刻释放挂在该 session 上的 buffer/MR。若 session 已 commit 或不存在，
// gateway 视为 no-op 返回成功。
message RdmaAbortRequest {
  string session_id = 1;
}

message RdmaAbortResponse {
  bool erased = 1;  // 是否真的移除了一个 entry（信息性，客户端可忽略）
}

service RdmaDataPlaneService {
  rpc DiscoverRdmaEndpoint(RdmaDiscoverRequest) returns (RdmaDiscoverResponse);
  rpc BindSessionToConnection(RdmaBindRequest) returns (RdmaBindResponse);
  rpc CommitObject(RdmaCommitRequest) returns (RdmaCommitResponse);
  rpc CommitPart(RdmaCommitPartRequest) returns (RdmaCommitPartResponse);
  rpc AbortSession(RdmaAbortRequest) returns (RdmaAbortResponse);
}
